<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        AURA ARMAN TOUR - Notification Admin
    </title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;

            background:
                radial-gradient(
                    circle at top,
                    #172554,
                    #020617 55%
                );

            color: white;

            min-height: 100vh;

            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 650px;
            margin: auto;
        }

        .header {
            text-align: center;
            margin-bottom: 20px;
        }

        .logo {
            width: 80px;
            height: 80px;
            border-radius: 22px;
            object-fit: cover;

            border:
                2px solid
                rgba(255,255,255,.15);

            margin-bottom: 12px;
        }

        .header h1 {
            font-size: 24px;
        }

        .header p {
            color: #94a3b8;
            margin-top: 6px;
            font-size: 13px;
        }

        .card {
            background:
                rgba(15,23,42,.88);

            border:
                1px solid
                rgba(255,255,255,.08);

            border-radius: 24px;

            padding: 20px;

            box-shadow:
                0 20px 60px
                rgba(0,0,0,.35);
        }

        .group {
            margin-bottom: 18px;
        }

        label {
            display: block;

            font-size: 13px;

            font-weight: bold;

            color: #cbd5e1;

            margin-bottom: 8px;
        }

        input,
        textarea {
            width: 100%;

            border:
                1px solid
                #334155;

            background:
                #020617;

            color: white;

            border-radius: 14px;

            padding: 13px;

            outline: none;
        }

        input:focus,
        textarea:focus {
            border-color:
                #3b82f6;
        }

        textarea {
            min-height: 110px;
            resize: vertical;
        }

        .targets {
            display: grid;

            grid-template-columns:
                1fr 1fr;

            gap: 10px;
        }

        .target {
            border:
                1px solid
                #334155;

            background:
                #020617;

            border-radius: 15px;

            padding: 14px;

            cursor: pointer;
        }

        .target input {
            width: auto;
            margin-right: 7px;
        }

        .target span {
            font-size: 13px;
        }

        #specificBox {
            display: none;
            margin-top: 12px;
        }

        .specific-actions {
            display: grid;

            grid-template-columns:
                1fr 1fr;

            gap: 8px;

            margin-top: 10px;
        }

        .check-btn {
            width: 100%;

            border: none;

            border-radius: 13px;

            padding: 11px;

            font-size: 12px;

            font-weight: bold;

            color: white;

            cursor: pointer;

            background:
                #334155;
        }

        .check-btn:hover {
            background:
                #475569;
        }

        .user-status {
            display: none;

            margin-top: 9px;

            padding: 10px 12px;

            border-radius: 12px;

            font-size: 12px;

            white-space: pre-wrap;

            word-break: break-word;
        }

        .user-status.success {
            display: block;

            background:
                rgba(34,197,94,.12);

            border:
                1px solid
                rgba(34,197,94,.3);

            color:
                #86efac;
        }

        .user-status.error {
            display: block;

            background:
                rgba(239,68,68,.12);

            border:
                1px solid
                rgba(239,68,68,.3);

            color:
                #fca5a5;
        }

        button {
            width: 100%;

            border: none;

            border-radius: 15px;

            padding: 15px;

            font-size: 15px;

            font-weight: bold;

            color: white;

            cursor: pointer;

            background:
                linear-gradient(
                    135deg,
                    #2563eb,
                    #7c3aed
                );
        }

        button:disabled {
            opacity: .6;
            cursor: not-allowed;
        }

        .result {
            display: none;

            margin-top: 18px;

            padding: 14px;

            border-radius: 14px;

            white-space: pre-wrap;

            word-break: break-word;

            font-size: 13px;
        }

        .success {
            display: block;

            background:
                rgba(34,197,94,.12);

            border:
                1px solid
                rgba(34,197,94,.3);

            color:
                #86efac;
        }

        .error {
            display: block;

            background:
                rgba(239,68,68,.12);

            border:
                1px solid
                rgba(239,68,68,.3);

            color:
                #fca5a5;
        }

        .footer {
            text-align: center;

            color: #64748b;

            font-size: 11px;

            margin-top: 15px;
        }

        @media (max-width: 500px) {

            .targets {
                grid-template-columns: 1fr;
            }

            .specific-actions {
                grid-template-columns:
                    1fr;
            }

        }

    </style>

</head>

<body>

<div class="container">

    <div class="header">

        <img
            class="logo"
            src="https://videotourl.com/images/1789792991627-2a906ffa-fbc0-4f79-9d9b-8dddb80ca667.jpg"
            alt="AURA"
        >

        <h1>
            AURA ARMAN TOUR
        </h1>

        <p>
            Notification Control Panel
        </p>

    </div>


    <div class="card">

        <div class="group">

            <label>
                Notification Target
            </label>


            <div class="targets">

                <label class="target">

                    <input
                        type="radio"
                        name="target"
                        value="all"
                        checked
                    >

                    <span>
                        All Users
                    </span>

                </label>


                <label class="target">

                    <input
                        type="radio"
                        name="target"
                        value="specific"
                    >

                    <span>
                        Specific User
                    </span>

                </label>

            </div>


            <div id="specificBox">

                <label>
                    Firebase UID / External ID
                </label>


                <input
                    id="externalId"
                    type="text"
                    placeholder="Enter Firebase UID"
                    autocomplete="off"
                >


                <div class="specific-actions">

                    <button
                        type="button"
                        id="checkUserBtn"
                        class="check-btn"
                    >
                        CHECK USER
                    </button>

                    <button
                        type="button"
                        id="clearUserBtn"
                        class="check-btn"
                    >
                        CLEAR
                    </button>

                </div>


                <div
                    id="userStatus"
                    class="user-status"
                ></div>

            </div>

        </div>


        <div class="group">

            <label>
                Notification Title
            </label>

            <input
                id="title"
                type="text"
                value="AURA ARMAN TOUR"
                readonly
                maxlength="150"
                aria-readonly="true"
            >

        </div>


        <div class="group">

            <label>
                Message Template
            </label>

            <select id="messageTemplate" style="
                width:100%;
                border:1px solid #334155;
                background:#020617;
                color:white;
                border-radius:14px;
                padding:13px;
                outline:none;
                font-size:14px;
            ">
                <option value="">— মেসেজ নির্বাচন করুন —</option>
                <option value="deposit_approve">ডিপোজিট অনুমোদন</option>
                <option value="deposit_reject">ডিপোজিট বাতিল</option>
                <option value="withdraw_approve">উইথড্র অনুমোদন</option>
                <option value="withdraw_reject">উইথড্র বাতিল</option>
            </select>

        </div>


        <div class="group" id="amountGroup" style="display:none;">

            <label>
                Amount (৳)
            </label>

            <input
                id="amount"
                type="number"
                min="0"
                step="0.01"
                placeholder="যেমন: 500"
                inputmode="decimal"
            >

        </div>


        <div class="group">

            <label>
                Message
            </label>

            <textarea
                id="message"
                placeholder="Write your notification message..."
                maxlength="1000"
            ></textarea>

        </div>


        <div class="group">

            <label>
                Icon URL (Optional)
            </label>

            <input
                id="icon"
                type="url"
                value="https://videotourl.com/images/1789792991627-2a906ffa-fbc0-4f79-9d9b-8dddb80ca667.jpg"
            >

        </div>


        <div class="group">

            <label>
                Big Image URL (Optional)
            </label>

            <input
                id="image"
                type="url"
                placeholder="https://example.com/image.jpg"
            >

        </div>


        <div class="group">

            <label>
                Click URL (Optional)
            </label>

            <input
                id="url"
                type="url"
                value="https://aura-skill-com.onrender.com"
            >

        </div>


        <button id="sendBtn">
            SEND NOTIFICATION
        </button>


        <div
            id="result"
            class="result"
        ></div>

    </div>


    <div class="footer">
        AURA ARMAN TOUR • Secure Notification System
    </div>

</div>


<script>

const targetInputs =
    document.querySelectorAll(
        'input[name="target"]'
    );


const specificBox =
    document.getElementById(
        "specificBox"
    );


const sendBtn =
    document.getElementById(
        "sendBtn"
    );


const result =
    document.getElementById(
        "result"
    );


const externalIdInput =
    document.getElementById(
        "externalId"
    );


const checkUserBtn =
    document.getElementById(
        "checkUserBtn"
    );


const clearUserBtn =
    document.getElementById(
        "clearUserBtn"
    );


const userStatus =
    document.getElementById(
        "userStatus"
    );


/* ============================================================
   TARGET SWITCH
============================================================ */

targetInputs.forEach(
    input => {

        input.addEventListener(
            "change",
            () => {

                if (
                    input.checked &&
                    input.value ===
                        "specific"
                ) {

                    specificBox.style.display =
                        "block";

                } else {

                    specificBox.style.display =
                        "none";

                    clearUserStatus();

                }

            }
        );

    }
);


/* ============================================================
   USER STATUS
============================================================ */

function clearUserStatus() {

    userStatus.textContent =
        "";

    userStatus.className =
        "user-status";

}


function showUserStatus(
    text,
    success
) {

    userStatus.textContent =
        text;

    userStatus.className =
        "user-status " +
        (
            success
                ? "success"
                : "error"
        );

}


/* ============================================================
   CHECK USER
============================================================ */

checkUserBtn.addEventListener(
    "click",
    async () => {

        const externalId =
            externalIdInput
                .value
                .trim();


        if (!externalId) {

            showUserStatus(
                "Please enter Firebase UID.",
                false
            );

            return;

        }


        checkUserBtn.disabled =
            true;

        checkUserBtn.textContent =
            "CHECKING...";


        try {

            const response =
                await fetch(
                    "/api/notifications/check-user",
                    {

                        method:
                            "POST",

                        headers: {

                            "Content-Type":
                                "application/json"

                        },

                        body:
                            JSON.stringify({

                                externalId

                            })

                    }
                );


            const rawText =
                await response.text();


            let data;


            try {

                data =
                    JSON.parse(
                        rawText
                    );

            } catch {

                data = {

                    success: false,

                    error:
                        rawText ||
                        "Invalid server response."

                };

            }


            if (
                !response.ok ||
                !data.success
            ) {

                throw new Error(
                    data.error ||
                    "User not found."
                );

            }


            if (
                data.subscribed
            ) {

                showUserStatus(

                    "✅ User is subscribed.\n" +
                    "Active subscriptions: " +
                    data.subscriptionCount,

                    true

                );

            } else {

                showUserStatus(

                    "⚠️ User exists in OneSignal, but no active push subscription was found.",

                    false

                );

            }


        } catch (error) {

            console.error(
                "Check user error:",
                error
            );


            showUserStatus(

                "❌ " +
                (
                    error.message ||
                    "User check failed."
                ),

                false

            );

        } finally {

            checkUserBtn.disabled =
                false;

            checkUserBtn.textContent =
                "CHECK USER";

        }

    }
);


/* ============================================================
   CLEAR USER
============================================================ */

clearUserBtn.addEventListener(
    "click",
    () => {

        externalIdInput.value =
            "";

        clearUserStatus();

        externalIdInput.focus();

    }
);


/* ============================================================
   MESSAGE TEMPLATES
============================================================ */

const messageTemplate =
    document.getElementById("messageTemplate");

const amountGroup =
    document.getElementById("amountGroup");

const amountInput =
    document.getElementById("amount");

const messageInput =
    document.getElementById("message");

const messageTemplates = {
    deposit_approve: amount =>
        `✅ আপনার ৳${amount} ডিপোজিট সফলভাবে অনুমোদন করা হয়েছে। ধন্যবাদ AURA ARMAN TOUR-এর সাথে থাকার জন্য।`,

    deposit_reject: amount =>
        `❌ আপনার ৳${amount} ডিপোজিটটি অনুমোদন করা যায়নি। অনুগ্রহ করে তথ্য যাচাই করে আবার চেষ্টা করুন।`,

    withdraw_approve: amount =>
        `✅ আপনার ৳${amount} উইথড্র সফলভাবে অনুমোদন করা হয়েছে। অনুগ্রহ করে আপনার পেমেন্ট অ্যাকাউন্ট চেক করুন।`,

    withdraw_reject: amount =>
        `❌ আপনার ৳${amount} উইথড্র অনুরোধটি অনুমোদন করা যায়নি। প্রয়োজনে সঠিক তথ্য দিয়ে আবার চেষ্টা করুন।`
};

function updateTemplateMessage() {
    const type = messageTemplate.value;

    if (!type) {
        amountGroup.style.display = "none";
        amountInput.value = "";
        messageInput.value = "";
        return;
    }

    amountGroup.style.display = "block";

    const amount = amountInput.value.trim();

    if (amount) {
        messageInput.value = messageTemplates[type](amount);
    } else {
        messageInput.value = "";
    }
}

messageTemplate.addEventListener(
    "change",
    updateTemplateMessage
);

amountInput.addEventListener(
    "input",
    updateTemplateMessage
);


/* ============================================================
   SEND NOTIFICATION
============================================================ */

sendBtn.addEventListener(
    "click",
    async () => {

        if (sendBtn.disabled) {

            return;

        }


        const selectedTarget =
            document.querySelector(
                'input[name="target"]:checked'
            );


        const target =
            selectedTarget
                ? selectedTarget.value
                : "all";


        const externalId =
            externalIdInput
                .value
                .trim();


        const title =
            "AURA ARMAN TOUR";


        const message =
            document
                .getElementById("message")
                .value
                .trim();

        const amount =
            amountInput.value.trim();


        const icon =
            document
                .getElementById("icon")
                .value
                .trim();


        const image =
            document
                .getElementById("image")
                .value
                .trim();


        const url =
            document
                .getElementById("url")
                .value
                .trim();


        /* =====================================================
           VALIDATION
        ===================================================== */

        if (!title) {

            showResult(
                "Please enter notification title.",
                false
            );

            return;

        }


        const selectedTemplate =
            messageTemplate.value;

        if (selectedTemplate && !amount) {

            showResult(
                "দয়া করে Amount লিখুন।",
                false
            );

            return;

        }


        if (!message) {

            showResult(
                "Please enter notification message.",
                false
            );

            return;

        }


        if (
            target === "specific" &&
            !externalId
        ) {

            showResult(
                "Please enter Firebase UID / External ID.",
                false
            );

            return;

        }


        sendBtn.disabled =
            true;


        sendBtn.textContent =
            "SENDING...";


        result.style.display =
            "none";


        try {

            const response =
                await fetch(
                    "/api/notifications/send",
                    {

                        method:
                            "POST",

                        headers: {

                            "Content-Type":
                                "application/json"

                        },

                        body:
                            JSON.stringify({

                                target,

                                externalId,

                                title,

                                message,

                                icon,

                                image,

                                url

                            })

                    }
                );


            const rawText =
                await response.text();


            let data;


            try {

                data =
                    JSON.parse(
                        rawText
                    );

            } catch {

                data = {

                    success: false,

                    error:
                        rawText ||
                        "Invalid server response."

                };

            }


            if (
                !response.ok ||
                !data.success
            ) {

                let errorMessage =
                    data.error ||
                    "Notification sending failed.";


                if (
                    data.onesignal &&
                    Array.isArray(
                        data.onesignal.errors
                    )
                ) {

                    const oneSignalErrors =
                        data.onesignal.errors.join(
                            ", "
                        );


                    errorMessage +=
                        "\n\nOneSignal: " +
                        oneSignalErrors;

                }


                throw new Error(
                    errorMessage
                );

            }


            showResult(

                "✅ Notification sent successfully!\n\n" +

                JSON.stringify(
                    data.onesignal ||
                    data,
                    null,
                    2
                ),

                true

            );


        } catch (error) {

            console.error(
                "Notification error:",
                error
            );


            showResult(

                "❌ Notification failed\n\n" +

                (
                    error.message ||
                    "Something went wrong."
                ),

                false

            );

        } finally {

            sendBtn.disabled =
                false;

            sendBtn.textContent =
                "SEND NOTIFICATION";

        }

    }
);


/* ============================================================
   RESULT
============================================================ */

function showResult(
    text,
    success
) {

    result.textContent =
        text;


    result.className =
        "result " +
        (
            success
                ? "success"
                : "error"
        );


    result.style.display =
        "block";

}


/* ============================================================
   ENTER KEY
============================================================ */

externalIdInput.addEventListener(
    "keydown",
    event => {

        if (
            event.key ===
            "Enter"
        ) {

            event.preventDefault();

            checkUserBtn.click();

        }

    }
);

</script>

</body>
</html>
