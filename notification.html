<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        AURA ARMAN TOUR - Notification Admin
    </title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;

            background:
                radial-gradient(
                    circle at top,
                    #172554,
                    #020617 55%
                );

            color: white;

            min-height: 100vh;

            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 650px;
            margin: auto;
        }

        .header {
            text-align: center;
            margin-bottom: 20px;
        }

        .logo {
            width: 80px;
            height: 80px;
            border-radius: 22px;
            object-fit: cover;

            border:
                2px solid
                rgba(255,255,255,.15);

            margin-bottom: 12px;
        }

        .header h1 {
            font-size: 24px;
        }

        .header p {
            color: #94a3b8;
            margin-top: 6px;
            font-size: 13px;
        }

        .card {
            background:
                rgba(15,23,42,.88);

            border:
                1px solid
                rgba(255,255,255,.08);

            border-radius: 24px;

            padding: 20px;

            box-shadow:
                0 20px 60px
                rgba(0,0,0,.35);
        }

        .group {
            margin-bottom: 18px;
        }

        label {
            display: block;

            font-size: 13px;

            font-weight: bold;

            color: #cbd5e1;

            margin-bottom: 8px;
        }

        input,
        textarea {
            width: 100%;

            border:
                1px solid
                #334155;

            background:
                #020617;

            color: white;

            border-radius: 14px;

            padding: 13px;

            outline: none;
        }

        input:focus,
        textarea:focus {
            border-color:
                #3b82f6;
        }

        textarea {
            min-height: 110px;
            resize: vertical;
        }

        .template-select { width:100%; border:1px solid #334155; background:#020617; color:white; border-radius:14px; padding:13px; outline:none; }
        .template-fields { display:none; }
        .template-fields.show { display:block; }
        .template-fields .field { margin-bottom:10px; }
        .template-fields .field:last-child { margin-bottom:0; }


        .targets {
            display: grid;

            grid-template-columns:
                1fr 1fr;

            gap: 10px;
        }

        .target {
            border:
                1px solid
                #334155;

            background:
                #020617;

            border-radius: 15px;

            padding: 14px;

            cursor: pointer;
        }

        .target input {
            width: auto;
            margin-right: 7px;
        }

        .target span {
            font-size: 13px;
        }

        #specificBox {
            display: none;
            margin-top: 12px;
        }

        .specific-actions {
            display: grid;

            grid-template-columns:
                1fr 1fr;

            gap: 8px;

            margin-top: 10px;
        }

        .check-btn {
            width: 100%;

            border: none;

            border-radius: 13px;

            padding: 11px;

            font-size: 12px;

            font-weight: bold;

            color: white;

            cursor: pointer;

            background:
                #334155;
        }

        .check-btn:hover {
            background:
                #475569;
        }

        .user-status {
            display: none;

            margin-top: 9px;

            padding: 10px 12px;

            border-radius: 12px;

            font-size: 12px;

            white-space: pre-wrap;

            word-break: break-word;
        }

        .user-status.success {
            display: block;

            background:
                rgba(34,197,94,.12);

            border:
                1px solid
                rgba(34,197,94,.3);

            color:
                #86efac;
        }

        .user-status.error {
            display: block;

            background:
                rgba(239,68,68,.12);

            border:
                1px solid
                rgba(239,68,68,.3);

            color:
                #fca5a5;
        }

        button {
            width: 100%;

            border: none;

            border-radius: 15px;

            padding: 15px;

            font-size: 15px;

            font-weight: bold;

            color: white;

            cursor: pointer;

            background:
                linear-gradient(
                    135deg,
                    #2563eb,
                    #7c3aed
                );
        }

        button:disabled {
            opacity: .6;
            cursor: not-allowed;
        }

        .result {
            display: none;

            margin-top: 18px;

            padding: 14px;

            border-radius: 14px;

            white-space: pre-wrap;

            word-break: break-word;

            font-size: 13px;
        }

        .success {
            display: block;

            background:
                rgba(34,197,94,.12);

            border:
                1px solid
                rgba(34,197,94,.3);

            color:
                #86efac;
        }

        .error {
            display: block;

            background:
                rgba(239,68,68,.12);

            border:
                1px solid
                rgba(239,68,68,.3);

            color:
                #fca5a5;
        }

        .footer {
            text-align: center;

            color: #64748b;

            font-size: 11px;

            margin-top: 15px;
        }

        @media (max-width: 500px) {

            .targets {
                grid-template-columns: 1fr;
            }

            .specific-actions {
                grid-template-columns:
                    1fr;
            }

        }

    </style>

</head>

<body>

<div class="container">

    <div class="header">

        <img
            class="logo"
            src="https://videotourl.com/images/1789792991627-2a906ffa-fbc0-4f79-9d9b-8dddb80ca667.jpg"
            alt="AURA"
        >

        <h1>
            AURA ARMAN TOUR
        </h1>

        <p>
            Notification Control Panel
        </p>

    </div>


    <div class="card">

        <div class="group">

            <label>
                Notification Target
            </label>


            <div class="targets">

                <label class="target">

                    <input
                        type="radio"
                        name="target"
                        value="all"
                        checked
                    >

                    <span>
                        All Users
                    </span>

                </label>


                <label class="target">

                    <input
                        type="radio"
                        name="target"
                        value="specific"
                    >

                    <span>
                        Specific User
                    </span>

                </label>

            </div>


            <div id="specificBox">

                <label>
                    Firebase UID / External ID
                </label>


                <input
                    id="externalId"
                    type="text"
                    placeholder="Enter Firebase UID"
                    autocomplete="off"
                >


                <div class="specific-actions">

                    <button
                        type="button"
                        id="checkUserBtn"
                        class="check-btn"
                    >
                        CHECK USER
                    </button>

                    <button
                        type="button"
                        id="clearUserBtn"
                        class="check-btn"
                    >
                        CLEAR
                    </button>

                </div>


                <div
                    id="userStatus"
                    class="user-status"
                ></div>

            </div>

        </div>


        <div class="group">

            <label>
                Notification Title
            </label>

            <input id="title" type="text" value="AURA ARMAN TOUR" readonly maxlength="150">

        </div>

        <div class="group">
            <label>Notification Template</label>
            <select id="template" class="template-select">
                <option value="">Select a message template</option>
                <option value="deposit_approve">📥 ডিপোজিট অনুমোদন</option>
                <option value="deposit_reject">❌ ডিপোজিট বাতিল</option>
                <option value="withdraw_approve">📤 উইথড্র অনুমোদন</option>
                <option value="withdraw_reject">❌ উইথড্র বাতিল</option>
                <option value="bonus">💰 বোনাস যোগ</option>
                <option value="reward">🎁 রিওয়ার্ড যোগ</option>
                <option value="tournament_win">🏆 টুর্নামেন্ট জিতেছেন</option>
                <option value="match_start">🎮 টুর্নামেন্ট শুরু</option>
                <option value="new_tournament">📢 নতুন টুর্নামেন্ট</option>
                <option value="tournament_cancel">⚠️ টুর্নামেন্ট বাতিল</option>
                <option value="account_update">⚠️ অ্যাকাউন্টে গুরুত্বপূর্ণ আপডেট</option>
                <option value="congratulations">🎉 অভিনন্দন বার্তা</option>
                <option value="announcement">📢 সবার জন্য ঘোষণা</option>
                <option value="new_update">🔥 নতুন আপডেট</option>
                <option value="urgent">🚨 জরুরি ঘোষণা</option>
                <option value="offer">🎁 বিশেষ অফার</option>
                <option value="notice">📣 গুরুত্বপূর্ণ নোটিশ</option>
                <option value="welcome">👋 স্বাগতম বার্তা</option>
                <option value="password_changed">🔄 পাসওয়ার্ড পরিবর্তন সফল</option>
                <option value="account_warning">⚠️ অ্যাকাউন্ট সতর্কতা</option>
                <option value="birthday">🎂 জন্মদিনের শুভেচ্ছা</option>
                <option value="match_soon">⏰ ম্যাচ শুরু হতে চলেছে</option>
                <option value="room_info">📋 রুম ID / Password প্রকাশ</option>
                <option value="match_suspended">🚫 ম্যাচ স্থগিত</option>
                <option value="results">📊 রেজাল্ট প্রকাশ</option>
                <option value="prize_distributed">🏅 পুরস্কার বিতরণ সম্পন্ন</option>
                <option value="team_update">👥 স্কোয়াড/টিম সংক্রান্ত আপডেট</option>
                <option value="cashback">💎 ক্যাশব্যাক যোগ</option>
                <option value="promo_reward">🎁 প্রোমো কোড রিওয়ার্ড</option>
                <option value="balance_adjustment">💸 ব্যালেন্স সমন্বয়</option>
                <option value="winning_prize">🪙 জয়ী পুরস্কার যোগ</option>
                <option value="maintenance">🛠️ সিস্টেম মেইনটেন্যান্স</option>
                <option value="event">📅 নতুন ইভেন্ট ঘোষণা</option>
                <option value="campaign">🔥 বিশেষ ক্যাম্পেইন</option>
                <option value="rules_update">📣 নিয়ম/নীতিমালা আপডেট</option>
                <option value="special_notice">🌟 বিশেষ নোটিশ</option>
            </select>
        </div>

        <div id="templateFields" class="group template-fields"></div>

        <div class="group">
            <label>Message</label>
            <textarea id="message" placeholder="Template select করলে message তৈরি হবে..." maxlength="1000"></textarea>
        </div>


        <div class="group">

            <label>
                Icon URL (Optional)
            </label>

            <input
                id="icon"
                type="url"
                value="https://videotourl.com/images/1789792991627-2a906ffa-fbc0-4f79-9d9b-8dddb80ca667.jpg"
            >

        </div>


        <div class="group">

            <label>
                Big Image URL (Optional)
            </label>

            <input
                id="image"
                type="url"
                placeholder="https://example.com/image.jpg"
            >

        </div>


        <div class="group">

            <label>
                Click URL (Optional)
            </label>

            <input
                id="url"
                type="url"
                value="https://aura-skill-com.onrender.com"
            >

        </div>


        <button id="sendBtn">
            SEND NOTIFICATION
        </button>


        <div
            id="result"
            class="result"
        ></div>

    </div>


    <div class="footer">
        AURA ARMAN TOUR • Secure Notification System
    </div>

</div>


<script>

const targetInputs =
    document.querySelectorAll(
        'input[name="target"]'
    );


const specificBox =
    document.getElementById(
        "specificBox"
    );


const sendBtn =
    document.getElementById(
        "sendBtn"
    );


const result =
    document.getElementById(
        "result"
    );


const externalIdInput =
    document.getElementById(
        "externalId"
    );


const checkUserBtn =
    document.getElementById(
        "checkUserBtn"
    );


const clearUserBtn =
    document.getElementById(
        "clearUserBtn"
    );


const userStatus =
    document.getElementById(
        "userStatus"
    );

const templateSelect = document.getElementById("template");
const templateFields = document.getElementById("templateFields");
const messageInput = document.getElementById("message");

const templateConfig = {
    deposit_approve:{fields:["amount"],msg:a=>`✅ আপনার ৳${a.amount||"0"} ডিপোজিট সফলভাবে অনুমোদন করা হয়েছে। আপনার AURA ARMAN TOUR অ্যাকাউন্টে টাকা যোগ হয়েছে।`},
    deposit_reject:{fields:["amount","reason"],msg:a=>`❌ আপনার ৳${a.amount||"0"} ডিপোজিটটি বাতিল করা হয়েছে।${a.reason?` কারণ: ${a.reason}`:""}`},
    withdraw_approve:{fields:["amount"],msg:a=>`✅ আপনার ৳${a.amount||"0"} উইথড্র সফলভাবে অনুমোদন করা হয়েছে।`},
    withdraw_reject:{fields:["amount","reason"],msg:a=>`❌ আপনার ৳${a.amount||"0"} উইথড্র অনুরোধটি বাতিল করা হয়েছে।${a.reason?` কারণ: ${a.reason}`:""}`},
    bonus:{fields:["amount"],msg:a=>`🎁 আপনার অ্যাকাউন্টে ৳${a.amount||"0"} বোনাস যোগ করা হয়েছে।`},
    reward:{fields:["reward"],msg:a=>`🎁 অভিনন্দন! আপনি ${a.reward||"বিশেষ রিওয়ার্ড"} পেয়েছেন।`},
    tournament_win:{fields:["amount"],msg:a=>`🏆 অভিনন্দন! আপনি টুর্নামেন্টে জয়ী হয়েছেন এবং ৳${a.amount||"0"} পুরস্কার পেয়েছেন।`},
    match_start:{fields:["tournament","time"],msg:a=>`🎮 ${a.tournament||"টুর্নামেন্ট"} শুরু হবে ${a.time||"শীঘ্রই"}। প্রস্তুত থাকুন!`},
    new_tournament:{fields:["tournament","entry"],msg:a=>`📢 নতুন টুর্নামেন্ট: ${a.tournament||"নতুন টুর্নামেন্ট"}${a.entry?` | Entry Fee: ৳${a.entry}`:""}। এখনই রেজিস্ট্রেশন করুন!`},
    tournament_cancel:{fields:["tournament","reason"],msg:a=>`⚠️ ${a.tournament||"টুর্নামেন্ট"} বাতিল করা হয়েছে।${a.reason?` কারণ: ${a.reason}`:""}`},
    account_update:{fields:["text"],msg:a=>`⚠️ আপনার অ্যাকাউন্টে গুরুত্বপূর্ণ আপডেট রয়েছে। ${a.text||"দয়া করে অ্যাকাউন্টটি চেক করুন।"}`},
    congratulations:{fields:["text"],msg:a=>`🎉 অভিনন্দন! ${a.text||"আপনার জন্য একটি বিশেষ শুভেচ্ছা রইল।"}`},
    announcement:{fields:["text"],msg:a=>`📢 ঘোষণা: ${a.text||"গুরুত্বপূর্ণ ঘোষণা রয়েছে।"}`},
    new_update:{fields:["text"],msg:a=>`🔥 নতুন আপডেট: ${a.text||"নতুন কিছু এসেছে! অ্যাপটি চেক করুন।"}`},
    urgent:{fields:["text"],msg:a=>`🚨 জরুরি ঘোষণা: ${a.text||"দয়া করে সর্বশেষ নির্দেশনা অনুসরণ করুন।"}`},
    offer:{fields:["text"],msg:a=>`🎁 বিশেষ অফার! ${a.text||"আজকের বিশেষ অফারটি মিস করবেন না।"}`},
    notice:{fields:["text"],msg:a=>`📣 গুরুত্বপূর্ণ নোটিশ: ${a.text||"দয়া করে নোটিশটি দেখে নিন।"}`},
    welcome:{fields:["name"],msg:a=>`👋 AURA ARMAN TOUR-এ আপনাকে স্বাগতম${a.name?`, ${a.name}`:""}! আমাদের সাথে থাকুন।`},
    password_changed:{fields:[],msg:()=>`🔄 আপনার পাসওয়ার্ড সফলভাবে পরিবর্তন করা হয়েছে।`},
    account_warning:{fields:["reason"],msg:a=>`⚠️ আপনার অ্যাকাউন্ট সম্পর্কে সতর্কতা: ${a.reason||"দয়া করে নিয়ম মেনে চলুন।"}`},
    birthday:{fields:["name"],msg:a=>`🎂 শুভ জন্মদিন${a.name?`, ${a.name}`:""}! AURA ARMAN TOUR-এর পক্ষ থেকে অনেক শুভেচ্ছা।`},
    match_soon:{fields:["tournament","time"],msg:a=>`⏰ ${a.tournament||"ম্যাচ"} শুরু হতে চলেছে${a.time?` — ${a.time}`:""}। প্রস্তুত থাকুন!`},
    room_info:{fields:["room","password"],msg:a=>`📋 রুম তথ্য প্রকাশ করা হয়েছে। Room ID: ${a.room||"—"} | Password: ${a.password||"—"}`},
    match_suspended:{fields:["tournament","reason"],msg:a=>`🚫 ${a.tournament||"ম্যাচ"} স্থগিত করা হয়েছে।${a.reason?` কারণ: ${a.reason}`:""}`},
    results:{fields:["tournament"],msg:a=>`📊 ${a.tournament||"টুর্নামেন্ট"}-এর রেজাল্ট প্রকাশ করা হয়েছে। এখনই দেখে নিন!`},
    prize_distributed:{fields:["amount"],msg:a=>`🏅 পুরস্কার বিতরণ সম্পন্ন হয়েছে। আপনার পুরস্কারের পরিমাণ: ৳${a.amount||"0"}।`},
    team_update:{fields:["text"],msg:a=>`👥 স্কোয়াড/টিম আপডেট: ${a.text||"আপনার টিম সংক্রান্ত নতুন তথ্য রয়েছে।"}`},
    cashback:{fields:["amount"],msg:a=>`💎 আপনার অ্যাকাউন্টে ৳${a.amount||"0"} ক্যাশব্যাক যোগ করা হয়েছে।`},
    promo_reward:{fields:["amount","code"],msg:a=>`🎁 প্রোমো রিওয়ার্ড!${a.amount?` ৳${a.amount}`:""}${a.code?` | Code: ${a.code}`:""}`},
    balance_adjustment:{fields:["amount","reason"],msg:a=>`💸 আপনার ব্যালেন্সে ৳${a.amount||"0"} সমন্বয় করা হয়েছে।${a.reason?` কারণ: ${a.reason}`:""}`},
    winning_prize:{fields:["amount"],msg:a=>`🪙 অভিনন্দন! আপনার জয়ী পুরস্কার ৳${a.amount||"0"} ব্যালেন্সে যোগ করা হয়েছে।`},
    maintenance:{fields:["time","text"],msg:a=>`🛠️ সিস্টেম মেইনটেন্যান্স: ${a.time?`সময়: ${a.time}। `:""}${a.text||"সাময়িকভাবে কিছু সেবা বন্ধ থাকতে পারে।"}`},
    event:{fields:["event","date"],msg:a=>`📅 নতুন ইভেন্ট: ${a.event||"বিশেষ ইভেন্ট"}${a.date?` | তারিখ: ${a.date}`:""}।`},
    campaign:{fields:["campaign"],msg:a=>`🔥 বিশেষ ক্যাম্পেইন: ${a.campaign||"নতুন ক্যাম্পেইন"}। অংশ নিতে এখনই অ্যাপে আসুন!`},
    rules_update:{fields:["text"],msg:a=>`📣 নিয়ম/নীতিমালা আপডেট: ${a.text||"নতুন নিয়ম প্রকাশ করা হয়েছে।"}`},
    special_notice:{fields:["text"],msg:a=>`🌟 বিশেষ নোটিশ: ${a.text||"আপনার জন্য একটি গুরুত্বপূর্ণ বার্তা রয়েছে।"}`}
};

const fieldLabels={amount:"Amount (৳)",reason:"কারণ",reward:"Reward",tournament:"Tournament Name",time:"সময়",entry:"Entry Fee (৳)",text:"বার্তা",name:"User Name",room:"Room ID",password:"Room Password",code:"Promo Code",event:"Event Name",date:"তারিখ",campaign:"Campaign Name"};
function renderTemplateFields(){const key=templateSelect.value,cfg=templateConfig[key];templateFields.innerHTML="";if(!cfg){templateFields.classList.remove("show");return;}templateFields.classList.add("show");cfg.fields.forEach(f=>{const wrap=document.createElement("div");wrap.className="field";wrap.innerHTML=`<label>${fieldLabels[f]||f}</label><input type="text" data-field="${f}" placeholder="${fieldLabels[f]||f}">`;templateFields.appendChild(wrap);});updateTemplateMessage();}
function updateTemplateMessage(){const key=templateSelect.value,cfg=templateConfig[key];if(!cfg)return;const a={};templateFields.querySelectorAll("[data-field]").forEach(i=>a[i.dataset.field]=i.value.trim());messageInput.value=cfg.msg(a);}
templateSelect.addEventListener("change",renderTemplateFields);templateFields.addEventListener("input",updateTemplateMessage);



/* ============================================================
   TARGET SWITCH
============================================================ */

targetInputs.forEach(
    input => {

        input.addEventListener(
            "change",
            () => {

                if (
                    input.checked &&
                    input.value ===
                        "specific"
                ) {

                    specificBox.style.display =
                        "block";

                } else {

                    specificBox.style.display =
                        "none";

                    clearUserStatus();

                }

            }
        );

    }
);


/* ============================================================
   USER STATUS
============================================================ */

function clearUserStatus() {

    userStatus.textContent =
        "";

    userStatus.className =
        "user-status";

}


function showUserStatus(
    text,
    success
) {

    userStatus.textContent =
        text;

    userStatus.className =
        "user-status " +
        (
            success
                ? "success"
                : "error"
        );

}


/* ============================================================
   CHECK USER
============================================================ */

checkUserBtn.addEventListener(
    "click",
    async () => {

        const externalId =
            externalIdInput
                .value
                .trim();


        if (!externalId) {

            showUserStatus(
                "Please enter Firebase UID.",
                false
            );

            return;

        }


        checkUserBtn.disabled =
            true;

        checkUserBtn.textContent =
            "CHECKING...";


        try {

            const response =
                await fetch(
                    "/api/notifications/check-user",
                    {

                        method:
                            "POST",

                        headers: {

                            "Content-Type":
                                "application/json"

                        },

                        body:
                            JSON.stringify({

                                externalId

                            })

                    }
                );


            const rawText =
                await response.text();


            let data;


            try {

                data =
                    JSON.parse(
                        rawText
                    );

            } catch {

                data = {

                    success: false,

                    error:
                        rawText ||
                        "Invalid server response."

                };

            }


            if (
                !response.ok ||
                !data.success
            ) {

                throw new Error(
                    data.error ||
                    "User not found."
                );

            }


            if (
                data.subscribed
            ) {

                showUserStatus(

                    "✅ User is subscribed.\n" +
                    "Active subscriptions: " +
                    data.subscriptionCount,

                    true

                );

            } else {

                showUserStatus(

                    "⚠️ User exists in OneSignal, but no active push subscription was found.",

                    false

                );

            }


        } catch (error) {

            console.error(
                "Check user error:",
                error
            );


            showUserStatus(

                "❌ " +
                (
                    error.message ||
                    "User check failed."
                ),

                false

            );

        } finally {

            checkUserBtn.disabled =
                false;

            checkUserBtn.textContent =
                "CHECK USER";

        }

    }
);


/* ============================================================
   CLEAR USER
============================================================ */

clearUserBtn.addEventListener(
    "click",
    () => {

        externalIdInput.value =
            "";

        clearUserStatus();

        externalIdInput.focus();

    }
);


/* ============================================================
   SEND NOTIFICATION
============================================================ */

sendBtn.addEventListener(
    "click",
    async () => {

        if (sendBtn.disabled) {

            return;

        }


        const selectedTarget =
            document.querySelector(
                'input[name="target"]:checked'
            );


        const target =
            selectedTarget
                ? selectedTarget.value
                : "all";


        const externalId =
            externalIdInput
                .value
                .trim();


        const title = "AURA ARMAN TOUR";


        const message =
            document
                .getElementById("message")
                .value
                .trim();


        const icon =
            document
                .getElementById("icon")
                .value
                .trim();


        const image =
            document
                .getElementById("image")
                .value
                .trim();


        const url =
            document
                .getElementById("url")
                .value
                .trim();


        /* =====================================================
           VALIDATION
        ===================================================== */

        if (!title) {

            showResult(
                "Please enter notification title.",
                false
            );

            return;

        }


        if (!message) {

            showResult(
                "Please enter notification message.",
                false
            );

            return;

        }


        if (
            target === "specific" &&
            !externalId
        ) {

            showResult(
                "Please enter Firebase UID / External ID.",
                false
            );

            return;

        }


        sendBtn.disabled =
            true;


        sendBtn.textContent =
            "SENDING...";


        result.style.display =
            "none";


        try {

            const response =
                await fetch(
                    "/api/notifications/send",
                    {

                        method:
                            "POST",

                        headers: {

                            "Content-Type":
                                "application/json"

                        },

                        body:
                            JSON.stringify({

                                target,

                                externalId,

                                title,

                                message,

                                icon,

                                image,

                                url

                            })

                    }
                );


            const rawText =
                await response.text();


            let data;


            try {

                data =
                    JSON.parse(
                        rawText
                    );

            } catch {

                data = {

                    success: false,

                    error:
                        rawText ||
                        "Invalid server response."

                };

            }


            if (
                !response.ok ||
                !data.success
            ) {

                let errorMessage =
                    data.error ||
                    "Notification sending failed.";


                if (
                    data.onesignal &&
                    Array.isArray(
                        data.onesignal.errors
                    )
                ) {

                    const oneSignalErrors =
                        data.onesignal.errors.join(
                            ", "
                        );


                    errorMessage +=
                        "\n\nOneSignal: " +
                        oneSignalErrors;

                }


                throw new Error(
                    errorMessage
                );

            }


            showResult(

                "✅ Notification sent successfully!\n\n" +

                JSON.stringify(
                    data.onesignal ||
                    data,
                    null,
                    2
                ),

                true

            );


        } catch (error) {

            console.error(
                "Notification error:",
                error
            );


            showResult(

                "❌ Notification failed\n\n" +

                (
                    error.message ||
                    "Something went wrong."
                ),

                false

            );

        } finally {

            sendBtn.disabled =
                false;

            sendBtn.textContent =
                "SEND NOTIFICATION";

        }

    }
);


/* ============================================================
   RESULT
============================================================ */

function showResult(
    text,
    success
) {

    result.textContent =
        text;


    result.className =
        "result " +
        (
            success
                ? "success"
                : "error"
        );


    result.style.display =
        "block";

}


/* ============================================================
   ENTER KEY
============================================================ */

externalIdInput.addEventListener(
    "keydown",
    event => {

        if (
            event.key ===
            "Enter"
        ) {

            event.preventDefault();

            checkUserBtn.click();

        }

    }
);

</script>
