<!doctype html>
<html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin Login</title>
<style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#050811;color:#fff;font-family:Arial,sans-serif}.card{width:min(380px,calc(100% - 32px));background:#0f172a;border:1px solid #24324a;border-radius:20px;padding:22px;box-sizing:border-box}h2{margin:0 0 16px}input,button{width:100%;box-sizing:border-box;padding:13px;border-radius:12px;margin-top:10px;border:1px solid #263449;background:#070d18;color:#fff}button{background:#2563eb;border:0;font-weight:700}#msg{font-size:13px;margin-top:12px;color:#94a3b8}</style></head>
<body><div class="card"><h2>Admin Login</h2><input id="email" type="email" placeholder="Admin Gmail"><input id="password" type="password" placeholder="Password"><button id="login">Login</button><div id="msg"></div></div>
<script type="module">
import {auth,ADMIN_EMAIL,linkOneSignalUser} from './firebase.js';
import {signInWithEmailAndPassword,onAuthStateChanged} from 'https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js';
const $=id=>document.getElementById(id), msg=t=>$('msg').textContent=t;
onAuthStateChanged(auth,u=>{if(u&&String(u.email||'').toLowerCase()===ADMIN_EMAIL.toLowerCase()) location.replace('./index.html');});
$('login').onclick=async()=>{const email=$('email').value.trim(),password=$('password').value;if(email.toLowerCase()!==ADMIN_EMAIL.toLowerCase()){msg='শুধু Admin Gmail দিয়ে login করুন।';return}if(!password){msg='Password দিন।';return}$('login').disabled=true;msg='Login হচ্ছে...';try{const c=await signInWithEmailAndPassword(auth,email,password);try{await linkOneSignalUser(c.user)}catch{}location.replace('./index.html')}catch(e){msg='Login failed: '+(e.code||e.message)}finally{$('login').disabled=false}};
</script></body></html>
