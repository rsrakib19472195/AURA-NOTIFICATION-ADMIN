<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>AURA ARMAN • Admin Login</title>

<style>
:root{
  --green:#07833d;
  --dark:#05652f;
  --pale:#eaf8ef;
  --yellow:#f5d90a;
  --text:#18271e;
  --muted:#748078;
  --border:#dce8df;
}
*{box-sizing:border-box}
body{
  margin:0;min-height:100vh;min-height:100dvh;
  display:flex;align-items:center;justify-content:center;
  padding:20px 15px;
  font-family:"Noto Sans Bengali","Segoe UI",Arial,sans-serif;
  color:var(--text);
  background:
    radial-gradient(ellipse at 0 0,#d9f7df,transparent 38%),
    radial-gradient(ellipse at 100% 100%,#fff3a5,transparent 35%),
    #f8fbf8;
}
.page{width:100%;max-width:420px}
.brand{
  display:flex;align-items:center;justify-content:center;
  gap:12px;margin-bottom:22px
}
.logo{
  width:52px;height:52px;border-radius:16px;
  display:grid;place-items:center;color:white;font-size:28px;
  font-weight:900;background:linear-gradient(145deg,#087b38,#16b65a);
  box-shadow:0 8px 20px #07833d25;outline:2px solid #ccebd4;
  border:2px solid white
}
.brand-name{font-size:20px;font-weight:900}
.brand-name span{color:var(--green)}
.brand-sub{font-size:11px;color:var(--muted);margin-top:4px;letter-spacing:1px}
.card{
  position:relative;overflow:hidden;
  padding:29px 24px 23px;
  background:#ffffffed;border:1px solid #e0eae2;
  border-radius:24px;box-shadow:0 22px 60px #153a2215
}
.card:before{
  content:"";position:absolute;top:0;left:0;right:0;height:5px;
  background:linear-gradient(90deg,#07833d,#22b85c,#f5d90a)
}
.badge{
  width:max-content;margin:0 auto 16px;padding:7px 13px;
  border-radius:30px;color:var(--dark);background:var(--pale);
  border:1px solid #ccebd5;font-size:12px;font-weight:800
}
.dot{
  display:inline-block;width:7px;height:7px;
  border-radius:50%;background:#16a34a;margin-right:7px
}
h1{text-align:center;font-size:27px;margin:0;font-weight:900}
.subtitle{
  text-align:center;color:var(--muted);font-size:13px;
  line-height:1.9;margin:12px 0 23px
}
label{display:block;margin:16px 0 8px;font-size:13px;font-weight:800}
.field{position:relative}
.field-icon{
  position:absolute;left:13px;top:50%;transform:translateY(-50%);
  width:20px;height:20px;color:var(--green);pointer-events:none
}
input{
  width:100%;height:51px;padding:0 44px;
  border:1.5px solid var(--border);border-radius:12px;
  background:#fbfdfb;color:var(--text);outline:none;
  font-size:14px;font-family:inherit;
  transition:border-color .2s,box-shadow .2s
}
input:focus{border-color:var(--green);box-shadow:0 0 0 4px #07833d12;background:white}
input::placeholder{color:#9ba69e}
.toggle{
  position:absolute;right:6px;top:50%;transform:translateY(-50%);
  width:36px;height:36px;border:0;border-radius:9px;
  background:transparent;color:#75847a;cursor:pointer;padding:8px
}
.toggle svg{width:20px;height:20px}
.login-btn{
  width:100%;min-height:51px;margin-top:21px;padding:13px;
  display:flex;justify-content:center;align-items:center;gap:9px;
  color:white;border:0;border-radius:13px;
  background:linear-gradient(105deg,#087b38,#10a94d 68%,#c4d900);
  box-shadow:0 8px 20px #07833d20;
  font-family:inherit;font-size:14px;font-weight:900;
  cursor:pointer;transition:transform .2s,opacity .2s
}
.login-btn:hover:not(:disabled){transform:translateY(-1px)}
.login-btn:disabled{opacity:.7;cursor:not-allowed}
.spinner{
  display:none;width:16px;height:16px;border:2px solid #ffffff70;
  border-top-color:white;border-radius:50%;animation:spin .7s linear infinite
}
.login-btn.loading .spinner{display:block}
@keyframes spin{to{transform:rotate(360deg)}}

/* Compact message: hidden until needed */
#msg{
  display:none;margin-top:12px;padding:9px 11px;
  border-radius:10px;font-size:11px;line-height:1.8;
  overflow-wrap:anywhere
}
#msg.show{display:block}
#msg.ok{background:#eaf8ef;color:#08743a;border:1px solid #c7ecd2}
#msg.err{background:#fff1f2;color:#a81e32;border:1px solid #ffd3d8}
#msg.info{background:#fff9df;color:#765800;border:1px solid #f3e6a4}
.security{
  display:flex;justify-content:center;align-items:center;gap:7px;
  margin-top:19px;color:var(--muted);font-size:10px;text-align:center
}
.security svg{width:16px;height:16px;color:var(--green);flex-shrink:0}
.back{
  display:block;text-align:center;margin-top:21px;
  color:#42634d;text-decoration:none;font-size:13px;font-weight:800
}
.back:hover{color:var(--green)}
.footer{text-align:center;margin-top:19px;font-size:10px;color:#849087}
@media(max-width:380px){.card{padding:27px 18px 21px}}
@media(prefers-reduced-motion:reduce){
  *,*:before,*:after{animation:none!important;transition:none!important}
}
</style>
</head>

<body>
<main class="page">
  <header class="brand">
    <div class="logo" aria-hidden="true">A</div>
    <div>
      <div class="brand-name">AURA <span>ARMAN</span></div>
      <div class="brand-sub">TOUR • ADMIN PANEL</div>
    </div>
  </header>

  <section class="card">
    <div class="badge"><span class="dot"></span>নিরাপদ প্রবেশদ্বার</div>
    <h1>স্বাগতম!</h1>
    <p class="subtitle">
      আপনার অ্যাডমিন অ্যাকাউন্টে প্রবেশ করুন।<br>
      ইমেইল ও পাসওয়ার্ড দিয়ে লগইন করুন।
    </p>

    <form id="loginForm" novalidate>
      <label for="email">Gmail ঠিকানা</label>
      <div class="field">
        <svg class="field-icon" viewBox="0 0 24 24" fill="none"
          stroke="currentColor" stroke-width="1.8" aria-hidden="true">
          <rect x="3" y="5" width="18" height="14" rx="3"/>
          <path d="m4 7 8 6 8-6"/>
        </svg>
        <input id="email" type="email" autocomplete="username"
          placeholder="example@gmail.com" required maxlength="254">
      </div>

      <label for="password">পাসওয়ার্ড</label>
      <div class="field">
        <svg class="field-icon" viewBox="0 0 24 24" fill="none"
          stroke="currentColor" stroke-width="1.8" aria-hidden="true">
          <rect x="4" y="10" width="16" height="11" rx="2.5"/>
          <path d="M8 10V7a4 4 0 0 1 8 0v3"/>
          <circle cx="12" cy="15" r="1"/>
          <path d="M12 16v2"/>
        </svg>
        <input id="password" type="password"
          autocomplete="current-password"
          placeholder="আপনার পাসওয়ার্ড লিখুন" required maxlength="256">
        <button class="toggle" id="togglePassword" type="button"
          aria-label="পাসওয়ার্ড দেখুন" aria-pressed="false">
          <svg id="eyeIcon" viewBox="0 0 24 24" fill="none"
            stroke="currentColor" stroke-width="1.8"
            stroke-linecap="round" stroke-linejoin="round">
            <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7Z"/>
            <circle cx="12" cy="12" r="3"/>
          </svg>
        </button>
      </div>

      <button class="login-btn" id="loginBtn" type="submit">
        <span class="spinner" aria-hidden="true"></span>
        <span id="btnText">লগইন করুন</span>
      </button>

      <div id="msg" role="status" aria-live="polite"></div>
    </form>

    <div class="security">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
        stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 22s8-4 8-11V5l-8-3-8 3v6c0 7 8 11 8 11Z"/>
        <path d="m9 12 2 2 4-4"/>
      </svg>
      আপনার অ্যাকাউন্টের নিরাপত্তা আমাদের কাছে গুরুত্বপূর্ণ
    </div>
  </section>

  <a class="back" href="./index.html">← হোম পেজে ফিরে যান</a>
  <div class="footer">© AURA ARMAN TOUR • সর্বস্বত্ব সংরক্ষিত</div>
</main>

<script type="module">
import { initializeApp }
from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";

import {
  getAuth, signInWithEmailAndPassword,
  onAuthStateChanged, signOut
} from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

import {
  getFirestore, doc, getDoc
} from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyA2wYMZAMx6p2GRC21KGgsHgiCoVz--81A",
  authDomain: "aura-arman-tour.firebaseapp.com",
  databaseURL: "https://aura-arman-tour-default-rtdb.firebaseio.com",
  projectId: "aura-arman-tour",
  storageBucket: "aura-arman-tour.firebasestorage.app",
  messagingSenderId: "502326798792",
  appId: "1:502326798792:web:2afd27cb9cd44da48cb8fd"
};

const ADMIN_EMAIL = "auraskill19@gmail.com";
const LIMIT_KEY = "aura_login_attempts_v3";
const MAX_ATTEMPTS = 3;
const WINDOW_MS = 60_000;

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

const $ = id => document.getElementById(id);
const form = $("loginForm");
const emailInput = $("email");
const passwordInput = $("password");
const btn = $("loginBtn");
const btnText = $("btnText");
const msg = $("msg");
const togglePassword = $("togglePassword");
const eyeIcon = $("eyeIcon");

let submitting = false;
let redirecting = false;
let checking = false;
let authReady = false;
let generation = 0;
let attempts = [];
let cooldownTimer = null;

function bn(n) {
  return Number(n).toLocaleString("bn-BD");
}

function show(text, type = "info") {
  msg.className = type + " show";
  msg.textContent = text;
}

function hideMessage() {
  msg.className = "";
  msg.textContent = "";
}

function setLoading(value) {
  btn.classList.toggle("loading", value);
  btnText.textContent = value ? "অনুগ্রহ করে অপেক্ষা করুন..." : "লগইন করুন";
  emailInput.disabled = value;
  passwordInput.disabled = value;
  togglePassword.disabled = value;
}

function isCurrent(user, token) {
  return generation === token &&
    auth.currentUser?.uid === user?.uid;
}

/* Keep attempts through refreshes in the same browser. */
function readAttempts(now = Date.now()) {
  try {
    const raw = localStorage.getItem(LIMIT_KEY);
    const saved = raw ? JSON.parse(raw) : [];

    if (!Array.isArray(saved) ||
        saved.some(t => !Number.isSafeInteger(t) ||
                        t < 0 || t > now + 5000)) {
      throw new Error("Invalid rate limit data");
    }

    attempts = saved.filter(t => now - t < WINDOW_MS);
  } catch {
    attempts = attempts.filter(t => now - t < WINDOW_MS);
  }

  return attempts.slice();
}

function saveAttempts(list) {
  attempts = list.slice();

  try {
    localStorage.setItem(LIMIT_KEY, JSON.stringify(attempts));
  } catch {
    // If storage is blocked, the fallback works only until page reload.
  }
}

function waitRemaining(list, now = Date.now()) {
  if (list.length < MAX_ATTEMPTS) return 0;
  return Math.max(0, list[0] + WINDOW_MS - now);
}

function clearAttempts() {
  attempts = [];
  try {
    localStorage.removeItem(LIMIT_KEY);
  } catch {}
}

function refreshButton() {
  if (submitting || redirecting || checking) return;

  const list = readAttempts();
  const remaining = waitRemaining(list);

  btn.disabled = !authReady || remaining > 0;

  if (remaining > 0) {
    btnText.textContent = "সাময়িকভাবে বন্ধ";
  } else {
    btnText.textContent = "লগইন করুন";
  }
}

function updateCooldownMessage() {
  if (submitting || redirecting || checking) return;

  const list = readAttempts();
  const remaining = waitRemaining(list);

  if (remaining > 0) {
    const seconds = Math.ceil(remaining / 1000);
    const used = list.length;

    show(
      "আপনার " + bn(used) + " বার চেষ্টা শেষ। " +
      "আবার চেষ্টা করতে " + bn(seconds) + " সেকেন্ড অপেক্ষা করুন।",
      "err"
    );
  }

  refreshButton();
}

function recordAttempt() {
  const now = Date.now();
  const list = readAttempts(now);

  if (waitRemaining(list, now) > 0) {
    updateCooldownMessage();
    return false;
  }

  list.push(now);
  saveAttempts(list);
  return true;
}

function showAttemptResult() {
  const list = readAttempts();
  const remaining = waitRemaining(list);

  if (remaining > 0) {
    updateCooldownMessage();
    return;
  }

  const used = list.length;
  const left = MAX_ATTEMPTS - used;

  show(
    "লগইন সফল হয়নি। " + bn(used) + "/৩ বার চেষ্টা হয়েছে। " +
    "আর " + bn(left) + " বার চেষ্টা করতে পারবেন।",
    "err"
  );
}

function normalizeRole(role) {
  return String(role || "").trim().toLowerCase()
    .replace(/[\s-]+/g, "_");
}

function friendlyError(error) {
  const code = String(error?.code || "");

  if ([
    "auth/invalid-credential",
    "auth/wrong-password",
    "auth/invalid-login-credentials",
    "auth/user-not-found"
  ].includes(code)) {
    return "ইমেইল অথবা পাসওয়ার্ড সঠিক নয়। আবার চেষ্টা করুন।";
  }

  if (code === "auth/too-many-requests") {
    return "নিরাপত্তার কারণে আপাতত প্রবেশ বন্ধ রয়েছে। কিছুক্ষণ পর আবার চেষ্টা করুন।";
  }

  if (code === "auth/invalid-email") {
    return "সঠিক Gmail ঠিকানা লিখুন।";
  }

  if ([
    "auth/network-request-failed",
    "unavailable",
    "deadline-exceeded"
  ].includes(code)) {
    return "ইন্টারনেট সংযোগ পরীক্ষা করে আবার চেষ্টা করুন।";
  }

  return "এই মুহূর্তে প্রবেশ করা যাচ্ছে না। কিছুক্ষণ পর আবার চেষ্টা করুন।";
}

async function rejectUser(user, token) {
  if (!isCurrent(user, token)) return;

  generation++;
  if (auth.currentUser?.uid === user.uid) {
    await signOut(auth);
  }
}

async function verifyUser(user, token) {
  if (!user || !isCurrent(user, token)) return false;

  const email = String(user.email || "").trim().toLowerCase();

  if (email === ADMIN_EMAIL) {
    if (!isCurrent(user, token)) return false;

    clearAttempts();
    redirecting = true;
    show("লগইন সফল হয়েছে! প্যানেল খোলা হচ্ছে...", "ok");
    location.replace("./index.html");
    return true;
  }

  const snap = await getDoc(doc(db, "staffAdmins", email));
  if (!isCurrent(user, token)) return false;

  if (!snap.exists()) {
    await rejectUser(user, token);
    showAttemptResult();
    return false;
  }

  const staff = snap.data();
  const savedEmail = String(staff.email || "").trim().toLowerCase();
  const savedUid = String(staff.uid || staff.userId || "").trim();

  if (savedEmail !== email || savedUid !== user.uid) {
    await rejectUser(user, token);
    showAttemptResult();
    return false;
  }

  if (staff.enabled !== true) {
    await rejectUser(user, token);
    show("আপনার অ্যাকাউন্টটি বর্তমানে সক্রিয় নয়। কর্তৃপক্ষের সঙ্গে যোগাযোগ করুন।", "err");
    return false;
  }

  const role = normalizeRole(staff.role);
  const allowedRoles = [
    "deposit_admin",
    "withdraw_admin",
    "tournament_admin",
    "main_admin",
    "custom_admin",
    "admin"
  ];

  if (!allowedRoles.includes(role)) {
    await rejectUser(user, token);
    show("আপনার অ্যাকাউন্টে প্রবেশের অনুমতি নেই।", "err");
    return false;
  }

  if (!isCurrent(user, token)) return false;

  try {
    sessionStorage.setItem("auraStaffRole", role);
    sessionStorage.setItem(
      "auraStaffPermissions",
      JSON.stringify(
        Array.isArray(staff.permissions) ? staff.permissions : []
      )
    );
  } catch {}

  if (!isCurrent(user, token)) return false;

  clearAttempts();
  redirecting = true;
  show("লগইন সফল হয়েছে! প্যানেল খোলা হচ্ছে...", "ok");
  location.replace("./index.html");
  return true;
}

form.addEventListener("submit", async event => {
  event.preventDefault();

  if (submitting || redirecting || checking) return;

  const list = readAttempts();
  if (waitRemaining(list) > 0) {
    updateCooldownMessage();
    return;
  }

  const email = emailInput.value.trim().toLowerCase();
  const password = passwordInput.value;

  if (!email) {
    show("অনুগ্রহ করে আপনার Gmail ঠিকানা লিখুন।", "err");
    emailInput.focus();
    return;
  }

  /* Invalid domain is rejected BEFORE counting an attempt. */
  if (!/^[^\s@]+@gmail\.com$/i.test(email)) {
    show(
      "সঠিক Gmail ঠিকানা দিন। ঠিকানার শেষে @gmail.com থাকতে হবে।",
      "err"
    );
    emailInput.focus();
    return;
  }

  if (!password) {
    show("অনুগ্রহ করে আপনার পাসওয়ার্ড লিখুন।", "err");
    passwordInput.focus();
    return;
  }

  if (!authReady) {
    show("সিস্টেম প্রস্তুত হচ্ছে। একটু অপেক্ষা করুন।", "info");
    return;
  }

  if (!recordAttempt()) return;

  submitting = true;
  setLoading(true);
  show("আপনার তথ্য যাচাই করা হচ্ছে...", "info");

  try {
    const result = await signInWithEmailAndPassword(
      auth, email, password
    );

    const token = generation;

    if (auth.currentUser?.uid !== result.user.uid) return;

    const success = await verifyUser(result.user, token);

    if (!success && !redirecting) {
      // Keep the attempt counted; display compact Bengali feedback.
      if (!msg.classList.contains("show")) showAttemptResult();
    }
  } catch (error) {
    console.error("Login error:", error);

    if (!redirecting) {
      show(friendlyError(error), "err");

      try {
        if (auth.currentUser) {
          generation++;
          await signOut(auth);
        }
      } catch (signOutError) {
        console.error("Sign out error:", signOutError);
      }

      showAttemptResult();
    }
  } finally {
    submitting = false;

    if (!redirecting) {
      setLoading(false);
      refreshButton();
    }
  }
});

togglePassword.addEventListener("click", () => {
  const visible = passwordInput.type === "password";
  passwordInput.type = visible ? "text" : "password";

  togglePassword.setAttribute("aria-pressed", String(visible));
  togglePassword.setAttribute(
    "aria-label",
    visible ? "পাসওয়ার্ড লুকান" : "পাসওয়ার্ড দেখুন"
  );

  eyeIcon.innerHTML = visible
    ? '<path d="M3 3l18 18"/><path d="M10.6 10.6a2 2 0 0 0 2.8 2.8"/><path d="M9.9 5.2A10.8 10.8 0 0 1 12 5c6.5 0 10 7 10 7a16 16 0 0 1-3.1 3.8"/><path d="M6.2 6.2C3.5 8 2 12 2 12s3.5 7 10 7c1.2 0 2.3-.3 3.3-.7"/>'
    : '<path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/>';
});

window.addEventListener("pageshow", () => {
  refreshButton();
  updateCooldownMessage();
});

window.addEventListener("storage", event => {
  if (event.key === LIMIT_KEY) {
    refreshButton();
    updateCooldownMessage();
  }
});

onAuthStateChanged(auth, async user => {
  authReady = true;
  generation++;
  const token = generation;

  if (!user) {
    if (!submitting && !redirecting) refreshButton();
    return;
  }

  if (redirecting || submitting || checking) return;

  checking = true;
  setLoading(true);

  try {
    await verifyUser(user, token);
  } catch (error) {
    console.error("Session verification error:", error);

    if (isCurrent(user, token) && !redirecting) {
      show(friendlyError(error), "err");
      generation++;

      try {
        if (auth.currentUser?.uid === user.uid) {
          await signOut(auth);
        }
      } catch (signOutError) {
        console.error("Sign out error:", signOutError);
      }
    }
  } finally {
    checking = false;

    if (!redirecting && !submitting) {
      setLoading(false);
      refreshButton();
    }
  }
});

/* Small message only; no large counter panel. */
cooldownTimer = setInterval(() => {
  if (!submitting && !redirecting && !checking) {
    updateCooldownMessage();
  }
}, 1000);
</script>
