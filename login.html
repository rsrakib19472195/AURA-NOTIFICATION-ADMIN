<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>AURA ARMAN • Admin Login</title>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
font-family:Arial,sans-serif;background:#070b14;color:#fff;padding:20px}
.card{width:100%;max-width:390px;background:#101827;border:1px solid #26334a;
border-radius:22px;padding:26px;box-shadow:0 18px 60px #0008}
h1{margin:0 0 7px;font-size:24px}
.sub{color:#94a3b8;font-size:13px;margin-bottom:24px}
label{display:block;font-size:13px;font-weight:700;margin:14px 0 7px}
input{width:100%;padding:14px;border-radius:12px;border:1px solid #334155;
background:#0b1220;color:#fff;outline:none;font-size:15px}
input:focus{border-color:#38bdf8}
button{width:100%;margin-top:20px;padding:14px;border:0;border-radius:12px;
background:#2563eb;color:#fff;font-weight:800;font-size:15px;cursor:pointer}
button:disabled{opacity:.6}
#msg{min-height:20px;margin-top:14px;font-size:13px;line-height:1.45}
.ok{color:#4ade80}.err{color:#fb7185}.info{color:#fbbf24}
.back{display:block;text-align:center;margin-top:18px;color:#94a3b8;text-decoration:none;font-size:13px}
</style>
</head>
<body>
<div class="card">
<h1>Admin Login</h1>
<div class="sub">AURA ARMAN TOUR • Secure Admin Panel</div>

<form id="loginForm" novalidate>
<label for="email">Admin Gmail</label>
<input id="email" type="email" autocomplete="username"
placeholder="teamgamechangerofficial@gmail.com" required>

<label for="password">Password</label>
<input id="password" type="password" autocomplete="current-password"
placeholder="Enter admin password" required>

<button id="loginBtn" type="submit">LOGIN</button>
<div id="msg"></div>
</form>

<a class="back" href="./index.html">Back</a>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
import {
  getAuth,
  signInWithEmailAndPassword,
  onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyA2wYMZAMx6p2GRC21KGgsHgiCoVz--81A",
  authDomain: "aura-arman-tour.firebaseapp.com",
  databaseURL: "https://aura-arman-tour-default-rtdb.firebaseio.com",
  projectId: "aura-arman-tour",
  storageBucket: "aura-arman-tour.firebasestorage.app",
  messagingSenderId: "502326798792",
  appId: "1:502326798792:web:2afd27cb9cd44da48cb8fd"
};

const ADMIN_EMAIL = "teamgamechangerofficial@gmail.com";
const app = initializeApp(firebaseConfig);
const auth = getAuth(app);

const form = document.getElementById("loginForm");
const email = document.getElementById("email");
const password = document.getElementById("password");
const btn = document.getElementById("loginBtn");
const msg = document.getElementById("msg");

function show(text, cls="info"){
  msg.className = cls;
  msg.textContent = text || "";
}

function firebaseMessage(e){
  const code = String(e?.code || "");
  if(code === "auth/invalid-credential" || code === "auth/wrong-password")
    return "Email অথবা password সঠিক নয়।";
  if(code === "auth/user-not-found") return "এই Admin Gmail Firebase Auth-এ পাওয়া যায়নি।";
  if(code === "auth/too-many-requests") return "অনেকবার চেষ্টা হয়েছে। কিছুক্ষণ পরে আবার চেষ্টা করুন।";
  if(code === "auth/operation-not-allowed") return "Firebase Authentication-এ Email/Password Sign-in চালু নেই।";
  if(code === "auth/invalid-email") return "সঠিক Gmail দিন।";
  if(code === "auth/network-request-failed") return "Internet/Firebase connection সমস্যা হয়েছে।";
  if(code === "auth/user-disabled") return "এই Admin account disabled করা আছে।";
  return "Login failed: " + (e?.message || "Unknown error");
}

onAuthStateChanged(auth, user => {
  if(user && String(user.email || "").toLowerCase() === ADMIN_EMAIL.toLowerCase()){
    const next = new URLSearchParams(location.search).get("next");
    location.replace(next === "index.html" ? "./index.html" : "./index.html");
  }
});

form.addEventListener("submit", async e => {
  e.preventDefault();
  e.stopPropagation();

  const em = email.value.trim().toLowerCase();
  const pw = password.value;

  if(!em){ show("Admin Gmail দিন।","err"); email.focus(); return; }
  if(!pw){ show("Password দিন।","err"); password.focus(); return; }
  if(em !== ADMIN_EMAIL.toLowerCase()){
    show("এই Gmail-এর Admin access নেই।","err");
    return;
  }

  btn.disabled = true;
  btn.textContent = "LOGGING IN...";
  show("Firebase যাচাই করছে...","info");

  try{
    const cred = await signInWithEmailAndPassword(auth, em, pw);

    if(String(cred.user.email || "").toLowerCase() !== ADMIN_EMAIL.toLowerCase()){
      await auth.signOut();
      throw new Error("Admin access denied.");
    }

    show("Login successful. Admin Panel খুলছে...","ok");
    btn.textContent = "SUCCESS";

    setTimeout(() => location.replace("./index.html"), 250);
  }catch(err){
    console.error("ADMIN LOGIN ERROR:", err);
    show(firebaseMessage(err),"err");
    btn.disabled = false;
    btn.textContent = "LOGIN";
  }
});
</script>
</body>
</html>
