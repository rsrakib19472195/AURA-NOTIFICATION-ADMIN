
<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#070b14">
<title>AURA ARMAN • Admin Login</title>

<style>
*{box-sizing:border-box}
body{
  margin:0;min-height:100vh;display:flex;align-items:center;
  justify-content:center;font-family:Arial,sans-serif;
  background:#070b14;color:#fff;padding:20px
}
.card{
  width:100%;max-width:390px;background:#101827;
  border:1px solid #26334a;border-radius:22px;padding:26px;
  box-shadow:0 18px 60px #0008
}
h1{margin:0 0 7px;font-size:24px}
.sub{color:#94a3b8;font-size:13px;margin-bottom:24px}
label{display:block;font-size:13px;font-weight:700;margin:14px 0 7px}
input{
  width:100%;padding:14px;border-radius:12px;
  border:1px solid #334155;background:#0b1220;
  color:#fff;outline:none;font-size:15px
}
input:focus{border-color:#38bdf8}
button{
  width:100%;margin-top:20px;padding:14px;border:0;
  border-radius:12px;background:#2563eb;color:#fff;
  font-weight:800;font-size:15px;cursor:pointer
}
button:disabled{opacity:.6;cursor:wait}
#msg{min-height:20px;margin-top:14px;font-size:13px;line-height:1.6}
.ok{color:#4ade80}
.err{color:#fb7185}
.info{color:#fbbf24}
.back{
  display:block;text-align:center;margin-top:18px;
  color:#94a3b8;text-decoration:none;font-size:13px
}
.back:hover{color:#fff}
</style>
</head>

<body>
<div class="card">
  <h1>Admin Login</h1>
  <div class="sub">AURA ARMAN TOUR • Secure Admin Panel</div>

  <form id="loginForm" novalidate>
    <label for="email">Admin / Staff Gmail</label>
    <input id="email" type="email" autocomplete="username"
      placeholder="Enter your Gmail" required>

    <label for="password">Password</label>
    <input id="password" type="password"
      autocomplete="current-password"
      placeholder="Enter your password" required>

    <button id="loginBtn" type="submit">LOGIN</button>
    <div id="msg" role="status" aria-live="polite"></div>
  </form>

  <a class="back" href="./index.html">Back</a>
</div>

<script type="module">
import { initializeApp }
from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";

import {
  getAuth,
  signInWithEmailAndPassword,
  onAuthStateChanged,
  signOut
} from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

import {
  getFirestore,
  doc,
  getDoc
} from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyA2wYMZAMx6p2GRC21KGgsHgiCoVz--81A",
  authDomain: "aura-arman-tour.firebaseapp.com",
  databaseURL: "https://aura-arman-tour-default-rtdb.firebaseio.com",
  projectId: "aura-arman-tour",
  storageBucket: "aura-arman-tour.firebasestorage.app",
  messagingSenderId: "502326798792",
  appId: "1:502326798792:web:2afd27cb9cd44da48cb8fd"
};

const ADMIN_EMAIL = "auraskill19@gmail.com".toLowerCase();

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

const form = document.getElementById("loginForm");
const emailInput = document.getElementById("email");
const passwordInput = document.getElementById("password");
const btn = document.getElementById("loginBtn");
const msg = document.getElementById("msg");

let submitting = false;
let redirecting = false;
let checking = false;

function show(message, cls = "info") {
  msg.className = cls;
  msg.textContent = message;
}

function setLoading(loading) {
  btn.disabled = loading;
  btn.textContent = loading ? "VERIFYING..." : "LOGIN";
}

function normalizeRole(role) {
  return String(role || "")
    .trim()
    .toLowerCase()
    .replace(/[\s-]+/g, "_");
}

function firebaseMessage(error) {
  const code = String(error?.code || "");

  if (
    code === "auth/invalid-credential" ||
    code === "auth/wrong-password" ||
    code === "auth/invalid-login-credentials"
  ) return "Gmail অথবা password সঠিক নয়।";

  if (code === "auth/user-not-found")
    return "Firebase Authentication-এ এই Gmail নেই।";

  if (code === "auth/too-many-requests")
    return "অনেকবার চেষ্টা হয়েছে। পরে আবার চেষ্টা করুন।";

  if (code === "auth/operation-not-allowed")
    return "Firebase Email/Password Sign-in চালু করুন।";

  if (code === "auth/invalid-email")
    return "সঠিক Gmail address দিন।";

  if (code === "auth/network-request-failed")
    return "Internet connection পরীক্ষা করুন।";

  if (
    code === "permission-denied" ||
    code === "firestore/permission-denied"
  ) return "Firestore Rules staffAdmins পড়তে বাধা দিচ্ছে।";

  return "Login ব্যর্থ হয়েছে। Firebase settings পরীক্ষা করুন।";
}

async function verifyUser(user) {
  if (!user || redirecting) return;

  const email = String(user.email || "").trim().toLowerCase();

  // মূল Admin
  if (email === ADMIN_EMAIL) {
    redirecting = true;
    show("Admin login successful. Panel খুলছে...", "ok");
    location.replace("./index.html");
    return;
  }

  show("Firestore staffAdmins থেকে permission যাচাই হচ্ছে...", "info");

  let staffSnap;

  try {
    // Firestore document ID হলো Staff Gmail
    staffSnap = await getDoc(doc(db, "staffAdmins", email));
  } catch (error) {
    console.error("FIRESTORE STAFF ERROR:", error);
    throw error;
  }

  if (!staffSnap.exists()) {
    await signOut(auth);
    show("এই Gmail staffAdmins-এ পাওয়া যায়নি।", "err");
    return;
  }

  const staff = staffSnap.data();

  // Authentication account ও Staff record মিলিয়ে দেখা
  const savedEmail = String(staff.email || "")
    .trim().toLowerCase();

  const savedUid = String(staff.uid || staff.userId || "").trim();

  if (savedEmail !== email || savedUid !== user.uid) {
    await signOut(auth);
    show("Staff Gmail অথবা UID মিলছে না।", "err");
    return;
  }

  if (staff.enabled !== true) {
    await signOut(auth);
    show("আপনার Staff account disabled।", "err");
    return;
  }

  const role = normalizeRole(staff.role);

  const allowedRoles = [
    "deposit_admin",
    "withdraw_admin",
    "tournament_admin",
    "main_admin",
    "custom_admin",
    "admin"
  ];

  if (!allowedRoles.includes(role)) {
    await signOut(auth);
    show("আপনার Staff role অনুমোদিত নয়।", "err");
    return;
  }

  // Role ও permissions UI-তে প্রয়োজনে ব্যবহার করা যাবে।
  // এগুলো নিজে থেকে নিরাপদ authorization তৈরি করে না।
  try {
    sessionStorage.setItem("auraStaffRole", role);
    sessionStorage.setItem(
      "auraStaffPermissions",
      JSON.stringify(
        Array.isArray(staff.permissions) ? staff.permissions : []
      )
    );
  } catch (error) {
    console.warn("Session storage unavailable:", error);
  }

  redirecting = true;
  show("Staff permission যাচাই সফল! Panel খুলছে...", "ok");
  location.replace("./index.html");
}

form.addEventListener("submit", async event => {
  event.preventDefault();

  if (submitting || redirecting) return;

  const email = emailInput.value.trim().toLowerCase();
  const password = passwordInput.value;

  if (!email) {
    show("Gmail দিন।", "err");
    emailInput.focus();
    return;
  }

  if (!password) {
    show("Password দিন।", "err");
    passwordInput.focus();
    return;
  }

  submitting = true;
  setLoading(true);
  show("Firebase login হচ্ছে...", "info");

  try {
    const result = await signInWithEmailAndPassword(
      auth, email, password
    );

    await verifyUser(result.user);

  } catch (error) {
    console.error("LOGIN ERROR:", error);

    if (!redirecting) {
      show(firebaseMessage(error), "err");

      try {
        if (auth.currentUser) await signOut(auth);
      } catch (signOutError) {
        console.error(signOutError);
      }
    }
  } finally {
    submitting = false;
    if (!redirecting) setLoading(false);
  }
});

// আগে থেকেই signed-in থাকলেও permission যাচাই হবে।
onAuthStateChanged(auth, async user => {
  if (!user || redirecting || checking || submitting) return;

  checking = true;

  try {
    await verifyUser(user);
  } catch (error) {
    console.error("SESSION CHECK ERROR:", error);
    show(firebaseMessage(error), "err");

    try {
      if (auth.currentUser) await signOut(auth);
    } catch (signOutError) {
      console.error(signOutError);
    }
  } finally {
    checking = false;
  }
});
</script>
</body>
</html>
